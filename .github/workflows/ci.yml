name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations are in sync with the schema
        run: |
          pnpm db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "src/server/db/schema.ts changed without a committed migration. Run pnpm db:generate."
            git status --porcelain db/migrations
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
